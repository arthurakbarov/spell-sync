[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spell-sync"
version = "0.3.0"
description = "Sync personal spell-check words across OS, browsers, editors, and Hunspell"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Akbarov" }]
keywords = ["spellcheck", "spell-check", "dictionary", "sync", "dotfiles", "wordlist", "custom-words"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]
dependencies = [
    "textual>=8.2.8,<9",
]

[dependency-groups]
test-core = [
  "pytest>=9,<10",
  "hypothesis>=6.135,<7",
]
coverage = [
  "pytest-cov>=7,<8",
]
quality = [
  "ruff>=0.15,<1",
  "mypy>=2,<3",
]
packaging = [
  "build>=1,<2",
  "wheel>=0.47,<1",
  "setuptools>=77",
]
release-check = [
  "twine>=6,<7",
]
dev = [
  { include-group = "test-core" },
  { include-group = "coverage" },
  { include-group = "quality" },
]

[project.urls]
Homepage = "https://github.com/arthurakbarov/spell-sync"
Repository = "https://github.com/arthurakbarov/spell-sync"
Issues = "https://github.com/arthurakbarov/spell-sync/issues"
[project.optional-dependencies]
# Deprecated: use uv dependency-groups (dev, packaging, release-check) for maintainer workflows.
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
  "mypy>=2,<3",
  "hypothesis>=6.135,<7",
]

[tool.pytest.ini_options]
markers = [
  "owner: owner-only tests requiring maintainer workspace",
  "core: core domain and application tests",
  "tui: Textual UI tests",
  "execution_control: execution timing and admission tests",
  "environment: environment and compatibility tests",
  "packaging: wheel and packaging tests",
  "integration: slow integration tests",
]
addopts = "--strict-config --strict-markers"

[project.scripts]
spell-sync = "spell_sync.cli:entry_point"

[tool.setuptools.packages.find]
include = ["spell_sync*"]

[tool.setuptools.package-data]
spell_sync = ["bundled/*", "tui/*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["spell_sync"]

[tool.coverage.run]
source = ["spell_sync"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_covered = true

[tool.uv]
required-version = "==0.11.21"
default-groups = ["dev"]
python-downloads = "manual"
