<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Spell Sync dashboard sketch</title>
  <desc id="desc">Simplified preview of the Spell Sync terminal UI with Review and update as the main action.</desc>
  <rect width="720" height="340" rx="10" fill="#1c1c1c"/>
  <rect x="12" y="12" width="696" height="316" rx="6" fill="#111111" stroke="#3a3a3a"/>
  <text x="28" y="42" fill="#e8e8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">Spell Sync</text>
  <text x="28" y="68" fill="#9a9a9a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Your words - one private list on this computer</text>
  <rect x="28" y="90" width="664" height="52" rx="6" fill="#2a4a3a" stroke="#4a7a5a"/>
  <text x="44" y="122" fill="#d8f0e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">Review and update</text>
  <text x="280" y="122" fill="#9ec9b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Collect - preview - Update - preview</text>
  <rect x="28" y="156" width="210" height="36" rx="4" fill="#222222" stroke="#555555"/>
  <text x="44" y="179" fill="#dddddd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Check my apps</text>
  <rect x="250" y="156" width="210" height="36" rx="4" fill="#222222" stroke="#555555"/>
  <text x="266" y="179" fill="#dddddd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Collect my words</text>
  <rect x="472" y="156" width="220" height="36" rx="4" fill="#222222" stroke="#555555"/>
  <text x="488" y="179" fill="#dddddd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Update my apps</text>
  <text x="28" y="230" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">You always confirm a preview before anything changes.</text>
  <text x="28" y="258" fill="#8a8a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Built-in dictionaries are never changed - only custom word lists.</text>
  <text x="28" y="300" fill="#666666" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Sketch for orientation - real layout follows your terminal theme.</text>
</svg>
