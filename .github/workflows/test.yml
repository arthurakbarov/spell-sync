name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.21"
  CANONICAL_PYTHON: "3.12.13"
  UV_LOCK_FILE: uv.lock

jobs:
  full-ci:
    name: full-ci (ubuntu, py3.12.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        id: setup-python
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@3b63b7d66864d0662a8a6a4870cbbb8568a81eb3 # v6.0.0
        with:
          version: "0.11.21"
      - name: Sync project environment
        run: |
          uv lock --check
          "${{ steps.setup-python.outputs.python-path }}" scripts/project_environment.py sync --profile full-ci
      - name: Full CI
        run: |
          .venv/bin/python scripts/ci_runner.py

  compatibility-linux-py311:
    name: compatibility (ubuntu, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@3b63b7d66864d0662a8a6a4870cbbb8568a81eb3 # v6.0.0
        with:
          version: "0.11.21"
      - name: Compatibility checks
        run: |
          uv lock --check
          uv sync --python 3.11 --locked --no-python-downloads --no-default-groups --group test-core --group packaging
          uv run --python 3.11 --locked --no-sync --offline --no-python-downloads \
            python scripts/run_compatibility_checks.py --platform linux --python-version 3.11

  compatibility-macos-py312:
    name: compatibility (macos, py3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@3b63b7d66864d0662a8a6a4870cbbb8568a81eb3 # v6.0.0
        with:
          version: "0.11.21"
      - name: Compatibility checks
        run: |
          uv lock --check
          uv sync --python 3.12 --locked --no-python-downloads --no-default-groups --group test-core --group packaging
          uv run --python 3.12 --locked --no-sync --offline --no-python-downloads \
            python scripts/run_compatibility_checks.py --platform macos --python-version 3.12

  compatibility-windows-py312:
    name: compatibility (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@3b63b7d66864d0662a8a6a4870cbbb8568a81eb3 # v6.0.0
        with:
          version: "0.11.21"
      - name: Compatibility checks
        shell: bash
        run: |
          uv lock --check
          uv sync --python 3.12 --locked --no-python-downloads --no-default-groups --group test-core --group packaging
          uv run --python 3.12 --locked --no-sync --offline --no-python-downloads \
            python scripts/run_compatibility_checks.py --platform windows --python-version 3.12

  source-compat-linux-py313-experimental:
    name: source compatibility probe (ubuntu, py3.13)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@3b63b7d66864d0662a8a6a4870cbbb8568a81eb3 # v6.0.0
        with:
          version: "0.11.21"
      - name: Source-only future compatibility probe
        run: |
          # Public requires-python is >=3.11,<3.13 — do not uv sync / install the project
          # or its wheel on 3.13. Probe source importability from the checkout only.
          uv lock --check
          uv venv --python 3.13 --no-project .venv-py313-source-probe
          uv export --frozen --no-emit-project --no-default-groups \
            --group test-core --group packaging -o /tmp/spell-sync-py313-probe-reqs.txt
          uv pip install --python .venv-py313-source-probe \
            -r /tmp/spell-sync-py313-probe-reqs.txt
          PYTHONPATH="${GITHUB_WORKSPACE}" \
            .venv-py313-source-probe/bin/python scripts/run_compatibility_checks.py \
            --platform linux --python-version 3.13 --experimental --source-only
