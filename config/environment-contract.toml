schemaVersion = 1

[product]
pythonRequirement = ">=3.14,<3.15"

[maintainer]
implementation = "cpython"
canonicalPython = "3.14.6"
pythonProvider = "uv-managed"
dependencyManager = "uv"
environmentDirectory = ".venv"

[maintainer.pythonDownloads]
normalCommands = "forbidden"
bootstrapCommand = "allowed"

[compatibility]
blockingPython = ["3.14"]
experimentalPython = []

[platforms.product]
macos = true
linux = true
windows = true

[platforms.posixExecutionSupervision]
macos = true
linux = true
windows = false

[platforms.ownerSnapshot]
macos = true
linux = false
windows = false

[artifactVerifier]
pythonRequirement = ">=3.14,<3.15"
uvRequired = false
venvRequired = false

[toolchain]
uvRequiredVersion = "0.11.21"
canonicalMaintainerPython = "3.14.6"

[commands]
bootstrap = "python3 scripts/project_environment.py bootstrap --allow-python-download"
sync = "python3 scripts/project_environment.py sync"
check = "python3 scripts/project_environment.py check"
normalUvRun = "uv run --python 3.14.6 --locked --no-sync --offline --no-python-downloads"
